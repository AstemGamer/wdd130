<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Rafting Company Warrior for rafting reservations, questions, and suggestions.">
    <meta name="author" content="Aron Guerrero">
    <title>Contact Us | Rafting Company Warrior</title>

    <link rel="stylesheet" href="styles/contact/rafting.css">
</head>

<body>

    <header>
        <img src="images/z-raftingbw.png" alt="Rafting Company Warrior Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="company-info">
            <h1>Rafting Company Warrior</h1>

            <p>20 de Noviembre 388</p>
            <p>94000 Jalcomulco, Veracruz</p>
            <p>+52 5555667788</p>
            <p>raftingwarrior@byu.com</p>
        </section>

        <section class="contact-container">

            <div class="map">
                <iframe
                  src="https://maps.google.com/maps?q=jalcomulco&t=&z=13&ie=UTF8&iwloc=&output=embed"
                  loading="lazy" allowfullscreen>
                </iframe>
            </div>

            <form>

                <div class="contact-item">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="User" required>
                </div>

                <div class="contact-item">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="rafting@fun.com"
                      required>
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>

                    <div class="purpose">
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        <label for="general">General Inquiry</label>
                    </div>

                    <div class="purpose">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>
                    </div>

                    <div class="purpose">
                        <input type="radio" id="website" name="purpose" value="website">
                        <label for="website">Website Suggestion</label>
                    </div>
                </fieldset>

                <div class="message-box">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5"
                      placeholder="Type here"></textarea>
                </div>

                <div class="newsletter">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Get in Touch!</button>

            </form>

        </section>

        <section class="adventures">
            <h2>We are Here to Serve You</h2>

            <figure>
                <img src="images/aroni.jpeg" alt="Aron Warrior">
                <figcaption>Aron Warrior</figcaption>
            </figure>

            <figure>
                <img src="images/stephaniai.jpeg" alt="Stephania Warrior">
                <figcaption>Stephania Warrior</figcaption>
            </figure>

            <figure>
                <img src="images/manueli.jpeg" alt="Manuel Warrior">
                <figcaption>Manuel Warrior</figcaption>
            </figure>

        </section>

    </main>

    <footer>

        <p>
            © 2026 Rafting Company Warrior | All Rights Reserved | Aron Guerrero
        </p>

        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook.jpg" alt="Facebook">
            </a>

            <a href="https://www.instagram.com">
                <img src="images/insta.jpg" alt="Instagram">
            </a>

            <a href="https://www.tiktok.com">
                <img src="images/tiktok.png" alt="TikTok">
            </a>
        </nav>

    </footer>

</body>

</html>
