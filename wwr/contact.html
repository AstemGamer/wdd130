    <header>

    <body>
        <main>
            <h1>Rafting Company Warrior</h1>
            <p>Adress: 20 de Noviembre 388, 94000 Jalcomulco, Ver.
                Number:+52 5555667788
                Email: rafingwarrior@byu.com
            </p>
            <form class="box">
                <div class="contact-item">
                    <label for="Name">Name</label>
                    <input type="text" id="Name" name="Name" placeholder="User">
                </div>

                <form class="box">
                    <div class="contact-item">
                        <label for="Email">Email</label>
                        <input type="text" id="Email" name="Email" placeholder="rafting@fun.com">
                    </div>

                    <tbody>
                        <tr>
                            <th rowspan="3">Massage propouse</th>
                            <form class="box">
                                <div class="contact-item">
                                    <label for="General Inquiry">General Inquiry</label>
                                    <input type="checkbox" id="General Inquiry"
                                      name="General Inquiry">
                                </div>
                                <form class="box">
                                    <div class="contact-item">
                                        <label for="Reservation Question">Reservation
                                            Question</label>
                                        <input type="checkbox" id="Reservation Question"
                                          name="Reservation Question">
                                    </div>
                                    <form class="box">
                                        <div class="contact-item">
                                            <label for="Website Suggestion">Website
                                                Suggestion</label>
                                            <input type="checkbox" id="Website Suggestion"
                                              name="Website Suggestion">
                                        </div>
                        </tr>
                    </tbody>

                    <div class="contact-item">
                        <label for="Message">.Message</label>
                        <textarea id="Message" name="Message" placeholder="Type here"></textarea>
                    </div>

                    <form class="box">
                        <div class="contact-item">
                            <label for="Subscribe">Please Subscribe me to the monthly
                                newsletter</label>
                            <input type="checkbox" id="Subscribe" name="Subscribe">
                        </div>

                        <button type="submit">Get in Touch!</button>
                    </form>
        </main>
    </body>

    <section class="adventures">
        <h2>We are Here to Server You</h2>

        <figure>
            <img src="images/canyon-rush-img.jpg"

        <figure>
            <img src="images/thunder-gorge-img.jpg"
              alt="Group navigating white water rapids in a yellow raft">
            <figcaption>Thunder Gorge</figcaption>
        </figure>

        <figure>
            <img src="images/big-mallard-img.jpg"
              alt="Rafting team paddling a red raft through strong rapids">
            <figcaption>Big Mallard</figcaption>
        </figure>


    </section>
